<!DOCTYPE html>

<html>

<head>

<title>APSS Student Login</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>


<div class="login-box">


<h2>
Student Login
</h2>


<p>
Enter your university email to continue.
</p>



{% if error %}

<p class="error">
{{ error }}
</p>

{% endif %}



<form method="POST">


<label>
Student Email
</label>


<input
type="email"
name="email"
placeholder="example@student.apu.edu.my"
required>



<button type="submit">

Login

</button>


</form>


</div>


</body>

</html>
